name: Winget

# Opens a pull request against microsoft/winget-pkgs for each published release, so `winget upgrade`
# sees it. The first version has to be submitted by hand (see packaging/winget/README.md); after
# that this keeps the package current.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit, such as v0.2.0 (leave empty for the latest stable release)
        required: false

jobs:
  winget:
    runs-on: ubuntu-latest
    # Needs the WINGET_TOKEN secret: a classic personal access token with public_repo, from an
    # account that has forked microsoft/winget-pkgs.
    if: ${{ github.repository_owner == '0xbasinas' && !github.event.release.prerelease }}
    steps:
      # Winget pins each version to one installer URL and hash, so "latest" is resolved to a tag here.
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: BeddCode.BeddCode
          installers-regex: 'BeddCode-Setup-.*\.exe$'
          release-tag: ${{ steps.tag.outputs.name }}
          token: ${{ secrets.WINGET_TOKEN }}
