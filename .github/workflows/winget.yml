name: Winget

# Opens a pull request against microsoft/winget-pkgs for each published release, so `winget upgrade`
# sees it. The first version has to be submitted by hand (see packaging/winget/README.md); after
# that this keeps the package current. It uses Microsoft's own wingetcreate, no third-party action.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit, such as v0.2.0 (leave empty for the latest stable release)
        required: false

jobs:
  winget:
    runs-on: windows-latest
    # Needs the WINGET_TOKEN secret: a classic personal access token with public_repo, from an
    # account that has forked microsoft/winget-pkgs.
    if: ${{ github.repository_owner == '0xbasinas' && !github.event.release.prerelease }}
    steps:
      # Winget pins each version to one installer URL and hash, so "latest" is resolved to a tag here.
      - name: Find the release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if (-not $env:TAG) { $env:TAG = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName }
          $url = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[] | select(.name | test("^BeddCode-Setup-.*\.exe$")) | .url'
          if (-not $url) { throw "No BeddCode-Setup installer on release $env:TAG" }
          "version=$($env:TAG.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          "url=$url" >> $env:GITHUB_OUTPUT
      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update BeddCode.BeddCode --version ${{ steps.release.outputs.version }} --urls ${{ steps.release.outputs.url }} --submit --token $env:WINGET_TOKEN
