name: Android

# Builds the phone app as installable APKs. Pushing a tag such as v0.2.0 builds both the release
# (standalone) and the debug (development) APK and attaches them to that release, next to the
# desktop installers. "Run workflow" builds just the one you choose and keeps it as a downloadable
# artifact. The debug build loads the app from `pnpm --filter @beddcode/mobile start` instead of
# carrying it inside.
#
# The APK is signed with the debug key unless these repository secrets are set, which signs it with
# your own key so later builds update the installed app in place:
#   ANDROID_KEYSTORE_BASE64 (the .jks file, base64), ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      variant:
        description: release (standalone app) or debug (development build)
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: write

jobs:
  apk:
    name: APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'push' && '["release","debug"]' || format('["{0}"]', inputs.variant)) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile

      # Each build needs a higher version code than the one before for an update to install over it.
      - name: Number the build
        working-directory: apps/mobile
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('version', app.expo.version, 'code', app.expo.android.versionCode);
          "

      # Push alerts need Firebase's google-services.json and the Expo project id. Both are optional:
      # without them the app builds as before and its alerts switch explains what is missing.
      - name: Add the push alert settings, if there are any
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json
          fi

      # The android/ folder is generated from app.json and its plugins; it is not kept in the repo.
      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Use the release keystore, if there is one
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: ${{ matrix.variant == 'debug' && 'development' || 'production' }}
          KEYSTORE_FILE: ${{ steps.signing.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing=()
          if [ -n "$KEYSTORE_FILE" ]; then
            signing=(
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE"
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            )
          fi
          # arm64 covers every phone made in the last several years and keeps the APK small.
          ./gradlew ${{ matrix.variant == 'debug' && 'assembleDebug' || 'assembleRelease' }} --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PreactNativeArchitectures=arm64-v8a \
            "${signing[@]}"

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          variant="${{ matrix.variant }}"
          suffix=""
          [ "$variant" = debug ] && suffix="-dev"
          name="BeddCode-${version}-android${suffix}.apk"
          cp "apps/mobile/android/app/build/outputs/apk/$variant/app-$variant.apk" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # The desktop installers are published to the same release by the Release workflow. Whichever
      # job gets there first creates it as a draft; the other adds to it.
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "${TAG#v}" --notes "" || true
          gh release upload "$TAG" "$APK" --clobber
