<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeddCode</title>
    <meta name="theme-color" content="#101010" />
    <script>
      // Pick the saved theme before the first paint so a light window never flashes dark.
      try {
        var saved = JSON.parse(localStorage.getItem('beddcode.app-preferences.v1') || 'null')
        var pref = saved && saved.theme
        var light =
          pref === 'light' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)
        if (light) document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Paint without waiting for Vite's module graph or the app's CSS on a cold start. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #101010;
      }
      #startup {
        height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        color: #8a8a8a;
        font:
          13px system-ui,
          sans-serif;
        -webkit-app-region: drag;
      }
      #startup img {
        width: 44px;
        height: 44px;
      }
    </style>
  </head>
  <body>
    <!-- React replaces this fallback when it commits the first app screen. -->
    <div id="root">
      <div id="startup" role="status" aria-label="Starting BeddCode">
        <img src="/favicon.svg" alt="" />
        <span>Starting BeddCode…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
