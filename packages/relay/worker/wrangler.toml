name = "beddcode-relay"
main = "worker.ts"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "METRICS"
class_name = "Metrics"

# SQLite-backed objects are the only kind the free plan offers; the relay only stores a small claim.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Metrics"]
